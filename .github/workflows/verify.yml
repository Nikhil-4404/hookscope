name: Verify release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest -q
        working-directory: backend
      - run: pip check
      - run: pip install pip-audit && pip-audit -r backend/requirements.lock
      - run: npm ci && npm run build && npm audit --omit=dev
        working-directory: frontend
      - run: docker compose --env-file deploy/production.env.example -f compose.production.yaml config --quiet
      - run: docker build -f backend/Dockerfile -t hookscope:verify .
      - run: python scripts/container_smoke.py
