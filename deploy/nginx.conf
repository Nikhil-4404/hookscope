worker_processes auto;
error_log /dev/stderr crit;
pid /var/run/nginx.pid;
events { worker_connections 512; }
http {
    access_log off;
    server_tokens off;
    # Only Caddy reaches this listener; it replaces X-Real-IP with its peer IP.
    limit_req_zone $http_x_real_ip zone=login:10m rate=5r/m;
    limit_req_zone $http_x_real_ip zone=webhooks:10m rate=20r/s;
    limit_req_zone $http_x_real_ip zone=management:10m rate=10r/s;
    limit_conn_zone $http_x_real_ip zone=connections:10m;
    limit_req_status 429;
    limit_conn_status 429;
    client_max_body_size 1536k;
    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 20s;
    proxy_read_timeout 30s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_real_ip;
    # Docker may assign a new address when the application container is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    server {
        listen 8080;
        set $hookscope_upstream hookscope:8787;
        limit_conn connections 20;
        location ~ ^/api/(login|register|setup|password)$ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://$hookscope_upstream$request_uri;
        }
        location /hooks/ {
            client_max_body_size 256k;
            limit_req zone=webhooks burst=40 nodelay;
            proxy_request_buffering off;
            proxy_pass http://$hookscope_upstream$request_uri;
        }
        location /api/ {
            limit_req zone=management burst=40 nodelay;
            proxy_pass http://$hookscope_upstream$request_uri;
        }
        location / {
            proxy_pass http://$hookscope_upstream$request_uri;
        }
    }
}
